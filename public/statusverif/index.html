<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Laporan Bulanan - Disdik Kota Ternate</title>

    <link rel="icon" type="image/png" href="https://disdik-ternate.github.io/portaldata/logo.png">

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background-color: #0f172a;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        #loadingBox {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e2e8f0;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
            text-align: center;
            padding: 24px;
        }
    </style>
</head>
<body>
    <!-- Dialihkan ke Si-ManDa V2 (verifikasi laporan), kode id dipertahankan -->
    <div id="loadingBox">Mengalihkan ke Si-ManDa V2...</div>

    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var id = params.get('id') || params.get('verifikasi') || '';

            if (!id) {
                document.getElementById('loadingBox').textContent =
                    'Kode verifikasi tidak ditemukan pada tautan ini.';
                return;
            }

            location.replace('https://si-manda.disdik-ternate.com/public/statusverif?id=' + encodeURIComponent(id));
        })();
    </script>
</body>
</html>
