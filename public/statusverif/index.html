<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Laporan Bulanan - Disdik Kota Ternate</title>

    <link rel="icon" type="image/png" href="https://disdik-ternate.github.io/portaldata/logo.png">

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background-color: #0f172a;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        #loadingBox {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e2e8f0;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
            text-align: center;
            padding: 24px;
        }
    </style>
</head>
<body>
    <!-- Menyembunyikan URL asli Apps Script: konten dimuat lewat iframe,
         alamat yang tampil di browser tetap disdik-ternate.com/public/statusverif -->
    <div id="loadingBox">Memuat status verifikasi laporan...</div>
    <iframe id="frameVerif" style="display:none" allowfullscreen></iframe>

    <script>
        (function () {
            var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx9l17lWragZ9gRQDiJKCdEdf8zF4RsYCYobbxWxcHTc2l8-x7hV-yT2fimc9GkhEFu/exec';

            var params = new URLSearchParams(window.location.search);
            var id = params.get('id') || params.get('verifikasi') || '';

            if (!id) {
                document.getElementById('loadingBox').textContent =
                    'Kode verifikasi tidak ditemukan pada tautan ini.';
                return;
            }

            var frame = document.getElementById('frameVerif');
            var box = document.getElementById('loadingBox');

            frame.onload = function () {
                box.style.display = 'none';
                frame.style.display = 'block';
            };

            frame.src = APPS_SCRIPT_URL + '?verifikasi=' + encodeURIComponent(id);
        })();
    </script>
</body>
</html>
