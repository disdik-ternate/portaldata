    /* ===================== LOADING SCREEN (redesain elegan/modern) =====================
       PERUBAHAN: desain ulang total layar loading - dari gaya "spinner ring + 3 blob"
       menjadi kartu kaca (glassmorphism) di tengah latar gradient mesh bernuansa
       aurora + pola grid titik halus, medali logo dengan cincin glow berdenyut lembut
       (bukan berputar kencang), status teks yang BERGANTI-GANTI (bukan statis) biar
       terasa "hidup", dan progress bar dengan efek shimmer bergerak. Struktur/ID yang
       dipakai script (#loadingScreen, .fade-out, #appFrame, handleFrameLoaded) TETAP
       dipertahankan sama persis - hanya tampilan & sedikit JS kosmetik baru. */
    #loadingScreen {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: #fff;
      background:
        radial-gradient(1100px 650px at 14% -8%, rgba(217, 164, 65, 0.14), transparent 60%),
        radial-gradient(900px 600px at 108% 14%, rgba(180, 130, 40, 0.16), transparent 55%),
        radial-gradient(1000px 700px at 50% 118%, rgba(120, 85, 25, 0.16), transparent 60%),
        linear-gradient(160deg, #1c1a17 0%, #17161a 46%, #0e0d0f 100%);
      transition: opacity 0.6s cubic-bezier(.4,0,.2,1), filter 0.6s cubic-bezier(.4,0,.2,1);
    }
    #loadingScreen.fade-out {
      opacity: 0;
      filter: blur(6px);
      pointer-events: none;
    }

    /* Pola grid titik halus - tekstur premium, sangat redup */
    #loadingScreen::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(212, 175, 110, 0.14) 1px, transparent 1px);
      background-size: 26px 26px;
      mask-image: radial-gradient(circle at 50% 42%, #000 0%, transparent 72%);
      -webkit-mask-image: radial-gradient(circle at 50% 42%, #000 0%, transparent 72%);
      pointer-events: none;
    }

    /* Blob aurora melayang lembut - lebih besar & lebih halus dari sebelumnya */
    .ls-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      will-change: transform;
    }
    .ls-blob-1 { width: 480px; height: 480px; background: radial-gradient(circle, rgba(217,164,65,.28), transparent 70%); top: -160px; left: -120px; animation: ls-float 13s ease-in-out infinite; }
    .ls-blob-2 { width: 420px; height: 420px; background: radial-gradient(circle, rgba(180,120,45,.26), transparent 70%); bottom: -150px; right: -110px; animation: ls-float 15s ease-in-out infinite reverse; }
    .ls-blob-3 { width: 320px; height: 320px; background: radial-gradient(circle, rgba(146,98,30,.20), transparent 70%); bottom: 10%; left: 6%; animation: ls-float 10.5s ease-in-out infinite; }
    @keyframes ls-float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(22px, -26px) scale(1.07); }
    }

    /* Kartu kaca (glassmorphism) di tengah */
    .ls-card {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: min(380px, 86vw);
      padding: 42px 30px 34px;
      text-align: center;
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(255,255,255,0.055), rgba(255,255,255,0.015));
      border: 1px solid rgba(212, 175, 110, 0.16);
      box-shadow:
        0 30px 70px -25px rgba(0, 0, 0, 0.7),
        inset 0 1px 0 rgba(255,255,255,0.06);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      animation: ls-rise 0.75s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes ls-rise {
      from { opacity: 0; transform: translateY(18px) scale(.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Medali logo: cincin glow berdenyut lembut (bukan berputar) + badge putih diam */
    .ls-icon-wrap {
      width: 88px; height: 88px;
      margin-bottom: 22px;
      position: relative;
      display: flex; align-items: center; justify-content: center;
    }
    .ls-icon-halo {
      position: absolute;
      inset: -14px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(217,164,65,.45), transparent 68%);
      filter: blur(14px);
      animation: ls-halo-pulse 2.6s ease-in-out infinite;
    }
    @keyframes ls-halo-pulse {
      0%, 100% { opacity: .55; transform: scale(.92); }
      50% { opacity: 1; transform: scale(1.08); }
    }
    .ls-icon-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      padding: 2.5px;
      background: conic-gradient(from 0deg, #f2c572, #d4a46e, #a9763b, #f2c572);
      animation: ls-spin 2.8s linear infinite;
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
    }
    @keyframes ls-spin {
      to { transform: rotate(360deg); }
    }
    .ls-icon-badge {
      position: relative;
      z-index: 1;
      width: 100%; height: 100%;
      margin: 0;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 28%, #ffffff, #eef2ff 70%);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 14px 30px -10px rgba(180,130,45,.55), inset 0 1px 2px rgba(15,23,42,.08);
      overflow: hidden;
      animation: ls-bob 3.4s ease-in-out infinite;
    }
    @keyframes ls-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .ls-icon-badge img { width: 84%; height: 84%; object-fit: contain; }


    .ls-brand {

    /* PERMINTAAN USER: efek huruf jatuh satu-satu, DIULANG terus-menerus selama
       layar loading masih tampil (berhenti sendiri begitu #loadingScreen dapat
       class .fade-out) - lihat replayBrandFall_() di <script> bawah. Animasinya
       sendiri cuma dipasang lewat class terpisah .is-falling (bukan di .ls-letter
       langsung) supaya JS bisa lepas-pasang class itu utk memicu ulang animasi
       tiap siklus; delay per huruf tetap lewat inline style (lebih spesifik dari
       class jadi tidak ikut ter-reset saat class di-lepas/pasang). */
    .ls-letter {
      display: inline-block;
      color: #f2c572;
      text-shadow: 0 2px 12px rgba(217,164,65,.45);
      opacity: 0;
      transform: translateY(-26px) scale(0.85);
    }
    .ls-letter.is-falling {
      animation: ls-letter-fall 0.65s cubic-bezier(.34,1.56,.64,1) forwards;
    }
    .ls-letter-sp { display: inline-block; width: 0.28em; }
    @keyframes ls-letter-fall {
      0% { opacity: 0; transform: translateY(-26px) scale(0.85); }
      55% { opacity: 1; transform: translateY(5px) scale(1.06); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .ls-title {
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: #ffffff;
      white-space: nowrap;
    }
    .ls-subtitle {
      font-size: 0.72rem;
      font-weight: 600;
      color: #d9a441;
      margin-top: 6px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
    }

    .ls-divider {
      width: 40px;
      height: 3px;
      margin: 18px 0 16px;
      border-radius: 999px;
      background: linear-gradient(90deg, #f2c572, #a9763b);
      opacity: .85;
    }

    .ls-status {
      min-height: 18px;
      font-size: 0.82rem;
      font-weight: 500;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    #lsStatusText {
      transition: opacity .25s ease, transform .25s ease;
    }
    #lsStatusText.ls-swap {
      opacity: 0;
      transform: translateY(3px);
    }
    .ls-dots { display: inline-flex; gap: 4px; }
    .ls-dots .dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: #d9a441;
      animation: ls-dot 1.2s ease-in-out infinite;
    }
    .ls-dots .dot:nth-child(2) { animation-delay: 0.2s; }
    .ls-dots .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes ls-dot {
      0%, 80%, 100% { opacity: 0.25; transform: scale(0.75); }
      40% { opacity: 1; transform: scale(1); }
    }

    .ls-bar {
      position: relative;
      width: 100%;
      max-width: 220px;
      height: 5px;
      margin-top: 24px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.10);
      overflow: hidden;
    }
    .ls-bar-fill {
      position: absolute;
      inset: 0;
      width: 38%;
      border-radius: 999px;
      background: linear-gradient(90deg, #f2c572, #d4a46e 55%, #a9763b);
      box-shadow: 0 0 14px rgba(212,164,78,.6);
      animation: ls-bar-move 1.5s cubic-bezier(.4,0,.2,1) infinite;
    }
    @keyframes ls-bar-move {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(360%); }
    }

    .ls-footer {
      position: absolute;
      bottom: 24px;
      left: 0; right: 0;
      z-index: 1;
      text-align: center;
      font-size: 0.68rem;
      font-weight: 500;
      color: rgba(203, 213, 225, 0.5);
      letter-spacing: 0.04em;
    }

    @media (max-width: 420px) {
      .ls-card { padding: 34px 22px 28px; }

      <div class="ls-bar"><div class="ls-bar-fill"></div></div>
    </div>
    <div class="ls-footer">Sistem Informasi Pendidikan &middot; Kota Ternate</div>
  </div>
  <!-- PERUBAHAN: ganti URL di bawah ini dengan URL Apps Script Anda sendiri -->
  <!-- PERUBAHAN (permintaan user - tiap menu dapat alamat sendiri di address bar,
  mis. simanda.disdik-ternate.com/dashMutasi): atribut src TIDAK diisi statis lagi di sini -
  sengaja diisi lewat script di bawah SEBELUM baris ini sempat memuat apa-apa,
  supaya tidak double-load (satu kali ke alamat kosong/lama, sekali lagi ke alamat
  yang benar). Loading screen di atasnya menutupi jeda sesaat ini. -->
  <iframe
    id="appFrame"
    onload="handleFrameLoaded()"
    allow="clipboard-read; clipboard-write"
  ></iframe>
  <script>
    // PERUBAHAN (desain ulang loading screen): teks status sekarang BERGANTI-GANTI
    // (bukan statis "Memuat Portal Data Pendidikan" saja) supaya terasa lebih hidup
    // selama proses pemuatan iframe Apps Script yang kadang perlu beberapa detik.
    // Murni kosmetik - tidak memengaruhi logika pemuatan/routing iframe di bawah.
    var LS_PESAN_ = [
      'Memuat Portal Data Pendidikan',
      'Menghubungkan ke server',
      'Menyiapkan data terbaru',
      'Hampir selesai'
    ];
    var lsPesanIdx_ = 0;
    var lsIntervalId_ = setInterval(function () {
      var el = document.getElementById('lsStatusText');
      if (!el) { clearInterval(lsIntervalId_); return; }
      el.classList.add('ls-swap');
      setTimeout(function () {
        lsPesanIdx_ = (lsPesanIdx_ + 1) % LS_PESAN_.length;
        el.textContent = LS_PESAN_[lsPesanIdx_];
        el.classList.remove('ls-swap');
      }, 250);
    }, 2200);

    // PERMINTAAN USER: efek huruf jatuh "Si - ManDa" diulang terus selama layar
    // loading masih tampil - lepas class .is-falling lalu paksa reflow (supaya
    // browser "melupakan" animasi yang sudah selesai) baru pasang lagi class-nya,
    // tiap ~2 detik (siklus terakhir selesai sekitar 0.35s+0.65s=1s, sisanya jeda
    // diam dulu sebelum jatuh lagi). Berhenti otomatis saat loadingScreen sudah
    // fade-out (akan dibuang dari DOM/disembunyikan oleh handleFrameLoaded()).
    function replayBrandFall_() {
      const ls = document.getElementById('loadingScreen');
      if (!ls || ls.classList.contains('fade-out')) return;
      const letters = document.querySelectorAll('.ls-letter');
      letters.forEach(function (el) { el.classList.remove('is-falling'); });
      void document.body.offsetWidth; // force reflow agar animasi bisa dipicu ulang
      letters.forEach(function (el) { el.classList.add('is-falling'); });
      setTimeout(replayBrandFall_, 2000);
    }
    setTimeout(replayBrandFall_, 2000);

    function handleFrameLoaded() {
      clearInterval(lsIntervalId_);
      const ls = document.getElementById('loadingScreen');
      ls.classList.add('fade-out');
      setTimeout(() => { ls.style.display = 'none'; }, 600);
    }

    var BASE_SRC = "https://script.google.com/macros/s/AKfycbx9l17lWragZ9gRQDiJKCdEdf8zF4RsYCYobbxWxcHTc2l8-x7hV-yT2fimc9GkhEFu/exec";

    // PERUBAHAN (permintaan user - routing alamat per menu): slug menu (mis.
    // "dashMutasi", "login") diambil dari PATH alamat ini (simanda.disdik-ternate.com/<slug>)
    // supaya alamat itu bisa langsung dibuka/dibagikan/dibookmark orang lain, lalu
    // diteruskan ke iframe Apps Script lewat parameter ?view=<slug> (Apps Script
    // sendiri tidak punya alamat path terpisah, cuma satu alamat .../exec dengan
    // parameter). Parameter query yang sudah ada sebelumnya (mis. ?t=xxx dari tombol
    // "Buka di Tab Baru") TETAP didahulukan kalau ada - dipakai keperluan lain,
    // bukan slug menu biasa.
    // PERUBAHAN (permintaan user): menu "Beranda" nama internalnya "dasborAppSiswa"
    // (kurang enak dilihat di address bar) - dipetakan ke alamat yang lebih ramah
    // "DasborManajemenData". Peta ini 2 arah: dipakai baik saat mengubah address
    // bar (nama internal -> alamat) maupun saat membaca alamat balik ke iframe
    // (alamat -> nama internal, supaya Apps Script tahu menu mana yang dimaksud).
    const ALIAS_SLUG_MENU_ = { 'dasborAppSiswa': 'DasborManajemenData' };
    const ALIAS_SLUG_MENU_BALIK_ = Object.fromEntries(Object.entries(ALIAS_SLUG_MENU_).map(([k, v]) => [v, k]));

    function ambilSlugDariPath_() {
      const slugPath = window.location.pathname.replace(/^\/+/, '').replace(/\/+$/, '');
      // Alamat pakai nama ramah (mis. "DasborManajemenData") - diterjemahkan balik
      // ke nama internal (mis. "dasborAppSiswa") sebelum diteruskan ke Apps Script.
      return ALIAS_SLUG_MENU_BALIK_.hasOwnProperty(slugPath) ? ALIAS_SLUG_MENU_BALIK_[slugPath] : slugPath;
    }
    function bangunSrcIframe_() {
      const params = window.location.search; // contoh: "?t=abc123"
      if (params) return BASE_SRC + params;
      const slug = ambilSlugDariPath_();
      return slug ? (BASE_SRC + "?view=" + encodeURIComponent(slug)) : BASE_SRC;
    }
    document.getElementById('appFrame').src = bangunSrcIframe_();

    // Nama internal menu -> alamat path di address bar. '' (kosong)/'publik' -> alamat utama ('/').
    function slugKeAlamat_(slug) {
      if (!slug || slug === 'publik') return '/';
      if (ALIAS_SLUG_MENU_.hasOwnProperty(slug)) return '/' + ALIAS_SLUG_MENU_[slug];
      return '/' + slug;
    }
    // Aplikasi di dalam iframe (Index.html, fungsi beriTahuUrlKeParent_) mengirim
    // pesan ini setiap kali menunya berpindah - address bar diubah lewat
    // history.pushState (TIDAK memuat ulang iframe, supaya tidak kehilangan state).
    window.addEventListener('message', function(e) {
      if (!e.data || typeof e.data.disdikView === 'undefined') return;
      const alamatBaru = slugKeAlamat_(e.data.disdikView);
      if (window.location.pathname !== alamatBaru) {
        history.pushState({ disdikView: e.data.disdikView }, '', alamatBaru);
      }
    });
    // Tombol back/forward browser - muat ulang iframe ke menu sesuai alamat baru.
    // Sengaja memuat ulang penuh (bukan lewat pesan ke iframe) - lebih sederhana &
    // lebih pasti benar, walau kehilangan state sementara di menu yang ditinggalkan.
    window.addEventListener('popstate', function() {
      document.getElementById('appFrame').src = bangunSrcIframe_();
    });
  </script>
</body>
</html>
